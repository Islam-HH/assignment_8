<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What’s For Dinner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./images/favicon.png" />
    <link rel="stylesheet" href="./css/fa.all.min.css" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid container-xl">
          <a class="navbar-brand" href="#">

              >
                <i class="fa-solid fa-utensils fs-4"></i>
              </div>
              <div>
                <h4 class="mb-0 fw-bold fs-5 ih-fs-lg-4">What’s For Dinner</h4>
                <p class="ih-fs-8 ih-fs-lg-7 text-gray-500 mb-0">

          </a>
          <button

            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <i class="fa-solid fa-bars mb-0"></i>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

                <div class="d-flex align-items-center">
                  <div
                    class="ih-square ih-w-h-4 rounded-circle border border-2 ih-border-orange-300 overflow-hidden me-2 me-lg-0"
                  >
                    <img
                      class="img-fluid"
                      src="./images/avatar-1.jpg"
                      alt="profile image"
                    />
                  </div>
                  <span class="d-lg-none">Profile</span>
                </div>

            </div>
